name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify source
        run: python tools/verify.py
      - name: Check source packaging
        run: python tools/package.py
      - name: Preserve verification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: host-checks-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            docs/records/host-checks.txt
            docs/records/verification.json
          if-no-files-found: warn
          retention-days: 7
